name: Release

# Triggers on git tag push `vX.Y.Z`. Builds + publishes to npm via
# Trusted Publishing (OIDC): no NPM_TOKEN secret, and provenance is
# attached automatically. Needs npm >= 11.5.1, hence the npm upgrade step.
#
# Setup once on npm:
#   npmjs.com → socialapis-sdk → Settings → Trusted Publisher →
#   GitHub Actions, organization SocialAPIsHub, repository
#   socialapis-js, workflow filename release.yml.

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for npm provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: npm ci || npm install
      - run: npm test
      - run: npm run build
      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::Tag ${tag} does not match package.json version ${pkg_version}"
            exit 1
          fi
      - run: npm publish --access public
